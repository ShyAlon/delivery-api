[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delivery-api"
description = "Orchestration: run links, run state machine, background jobs, storage, budget enforcement, per-stage cost rollup."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Shy Alon" }]
dynamic = ["version"]
dependencies = [
  "vmodel-contracts==0.28.0",
  "requi-child-contract==0.3.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6,<3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-dotenv>=1,<2",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
supabase = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4", "PyJWT[crypto]>=2.10,<3"]
turso = ["libsql>=0.1.11,<0.2"]
dev = ["PyYAML>=6,<7", "psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4", "PyJWT[crypto]>=2.10,<3", "pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "playwright>=1.48", "libsql>=0.1.11,<0.2", "pgserver>=0.1.4"]

[tool.hatch.version]
path = "src/delivery_api/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_api"]


[project.scripts]
vmodel-server = "delivery_api.__main__:main"

[tool.pytest.ini_options]
# Safety net: no single test may run longer than 5 minutes. The runner
# bounds silent engine subprocesses itself; this catches anything else.
timeout = 300
markers = [
    "engine_integration: requires an installed interview-engine; run explicitly in the full local integration check",
    "producer_integration: requires a configured spec-generator environment; run in the full local integration check",
    "ui_cosmetic: visual polish (brand, layout ratios, decorative styling) that neither blocks an action, hides required information, nor misleads about state or cost; failures are tracked debt reported by the separate nonblocking ui-cosmetic check, never a merge gate",
]

[tool.uv.sources]
requi-child-contract = { path = "vendor/requi_child_contract-0.3.0-py3-none-any.whl" }
vmodel-contracts = { path = "vendor/vmodel_contracts-0.28.0-py3-none-any.whl" }
