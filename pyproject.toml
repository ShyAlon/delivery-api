[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delivery-api"
description = "Orchestration: run links, run state machine, background jobs, storage, budget enforcement, per-stage cost rollup."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Shy Alon" }]
dynamic = ["version"]
dependencies = [
  "vmodel-contracts @ git+https://github.com/ShyAlon/vmodel-contracts.git@v0.14.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6,<3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.48"]

[tool.hatch.version]
path = "src/delivery_api/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_api"]


[project.scripts]
vmodel-server = "delivery_api.__main__:main"

[tool.hatch.build.targets.wheel.force-include]
"src/delivery_api/web" = "delivery_api/web"
