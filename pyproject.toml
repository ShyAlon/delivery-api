[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delivery-api"
description = "Orchestration: run links, run state machine, background jobs, storage, budget enforcement, per-stage cost rollup."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Shy Alon" }]
dynamic = ["version"]
dependencies = [
  "vmodel-contracts @ git+https://github.com/ShyAlon/vmodel-contracts.git@b9fbc33d1b02c04b7327a95d733b94b90cb0d25d",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6,<3",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
turso = ["libsql>=0.1.11,<0.2"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27", "playwright>=1.48", "libsql>=0.1.11,<0.2"]

[tool.hatch.version]
path = "src/delivery_api/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_api"]


[project.scripts]
vmodel-server = "delivery_api.__main__:main"

[tool.pytest.ini_options]
# Safety net: no single test may run longer than 5 minutes. The runner
# bounds silent engine subprocesses itself; this catches anything else.
timeout = 300
