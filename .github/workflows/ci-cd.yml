name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: delivery-api-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/shyalon/delivery-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Authenticate private vmodel-contracts clone
        env:
          VMODEL_CONTRACTS_PAT: ${{ secrets.VMODEL_CONTRACTS_PAT }}
        run: |
          test -n "$VMODEL_CONTRACTS_PAT" || { echo 'Error: VMODEL_CONTRACTS_PAT repo secret is unset. Create a fine-grained PAT with read-only contents on ShyAlon/vmodel-contracts, then: gh secret set VMODEL_CONTRACTS_PAT'; exit 1; }
          git config --global url."https://x-access-token:${VMODEL_CONTRACTS_PAT}@github.com/ShyAlon/vmodel-contracts.git".insteadOf "https://github.com/ShyAlon/vmodel-contracts.git"
      - run: pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare gitconfig for private vmodel-contracts clone
        env:
          VMODEL_CONTRACTS_PAT: ${{ secrets.VMODEL_CONTRACTS_PAT }}
        run: |
          test -n "$VMODEL_CONTRACTS_PAT" || { echo 'Error: VMODEL_CONTRACTS_PAT repo secret is unset.'; exit 1; }
          git config -f gitconfig.ci url."https://x-access-token:${VMODEL_CONTRACTS_PAT}@github.com/ShyAlon/vmodel-contracts.git".insteadOf "https://github.com/ShyAlon/vmodel-contracts.git"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          secret-files: |
            gitconfig=./gitconfig.ci
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          test -n "$HETZNER_HOST" || { echo 'Error: HETZNER_HOST is unset. Next: gh secret set HETZNER_HOST'; exit 1; }
          test -n "$HETZNER_SSH_KEY" || { echo 'Error: HETZNER_SSH_KEY is unset. Next: gh secret set HETZNER_SSH_KEY < ~/.ssh/vmodel-deploy'; exit 1; }
      - name: Trust host and load deploy key
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/vmodel-deploy
          chmod 600 ~/.ssh/vmodel-deploy
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
      - name: Deploy immutable image and verify health
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/vmodel-deploy deploy@"$HETZNER_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          scp -i ~/.ssh/vmodel-deploy scripts/deploy-server.sh deploy@"$HETZNER_HOST":/tmp/deploy-server.sh
          ssh -i ~/.ssh/vmodel-deploy deploy@"$HETZNER_HOST" \
            "chmod +x /tmp/deploy-server.sh && /tmp/deploy-server.sh '$DEPLOY_IMAGE'"
