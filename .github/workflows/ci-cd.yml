name: CI and deploy

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: delivery-api-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/shyalon/delivery-api

jobs:
  test:
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 20 || 10 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: python -m pip install vendor/vmodel_contracts-0.28.0-py3-none-any.whl vendor/requi_child_contract-0.3.0-py3-none-any.whl
      - run: DELIVERY_TEST_SCOPE=pr ./scripts/test-local.sh
        env:
          DELIVERY_BROWSER_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'smoke' }}

  fresh-start-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require cross-repository source access
        env:
          SOURCE_READ_TOKEN: ${{ secrets.ITEM6_SOURCE_READ_TOKEN }}
        run: test -n "$SOURCE_READ_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: ShyAlon/interview-engine
          ref: d6b3e690ec58caceb7446f0ae629d122f31cfa30
          path: acceptance-sources/interview-engine
          token: ${{ secrets.ITEM6_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ShyAlon/spec-generator
          ref: adf43ff21ecd8252c1cffeff4909a5ff148a8c76
          path: acceptance-sources/spec-generator
          token: ${{ secrets.ITEM6_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real runtime and test packages
        run: |
          python -m pip install vendor/vmodel_contracts-0.28.0-py3-none-any.whl vendor/requi_child_contract-0.3.0-py3-none-any.whl
          python -m pip install -e '.[dev]'
          python -m pip install -e acceptance-sources/interview-engine
          python -m pip install -e acceptance-sources/spec-generator
      - name: Real startup and first interview stage, zero credits
        run: python scripts/ci/fresh-start-acceptance.py

  # Tracked cosmetic debt, not part of the merge-gating selection: visual-polish
  # assertions marked ui_cosmetic. This job reports honest red on failure so the
  # debt stays visible; the gating test job excludes these tests, and the image
  # build does not wait on this job.
  ui-cosmetic:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: python -m pip install vendor/vmodel_contracts-0.28.0-py3-none-any.whl vendor/requi_child_contract-0.3.0-py3-none-any.whl
      - run: DELIVERY_TEST_SCOPE=cosmetic ./scripts/test-local.sh

  control-plane-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pgserver psycopg[binary]
      - run: python -m build --wheel --outdir /tmp/control-plane-wheels
      - name: Clean delivery-only install and dry startup
        run: |
          python -m venv /tmp/control-plane-runtime
          /tmp/control-plane-runtime/bin/pip install vendor/vmodel_contracts-0.28.0-py3-none-any.whl vendor/requi_child_contract-0.3.0-py3-none-any.whl /tmp/control-plane-wheels/*.whl 'psycopg[binary]>=3.2,<4'
          /tmp/control-plane-runtime/bin/pip check
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/docker/owned-pg-smoke.py" "$GITHUB_WORKSPACE" /tmp/control-plane-runtime/bin/python "$GITHUB_WORKSPACE/scripts/docker/control-plane-smoke.py"

  image:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, control-plane-wheel, fresh-start-acceptance]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Dry delivery-only container gate before publication
        run: |
          docker build --tag requi-control-plane-check .
          docker build --file scripts/docker/Dockerfile.pg-smoke --tag requi-control-plane-pg-check .
          docker run --detach --name requi-control-plane-check --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 requi-control-plane-pg-check
          trap 'docker logs requi-control-plane-check; docker rm --force requi-control-plane-check' EXIT
          for attempt in $(seq 1 20); do
            state=$(docker inspect --format '{{.State.Health.Status}}' requi-control-plane-check)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then exit 1; fi
            sleep 3
          done
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
