name: CI and deploy

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
  # Full matrix against main once a week (Sunday 02:41 UTC, low traffic); the
  # every-PR gate stays under five minutes.
  schedule:
    - cron: '41 2 * * 0'

permissions:
  contents: read
  packages: write

concurrency:
  group: delivery-api-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/shyalon/delivery-api

jobs:
  # Every-PR gate: fast deterministic core (no Postgres, no browser) plus
  # boundary checks on a single runner. The full four-shard matrix below runs
  # on workflow_dispatch, nightly, and when a PR is marked ready_for_review.
  gate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: python -m pip install vendor/vmodel_contracts-0.29.0-py3-none-any.whl vendor/requi_child_contract-0.3.0-py3-none-any.whl
      - name: Enforce zero UI component exceptions
        run: python scripts/ci/check-ui-boundaries.py
      - name: Enforce prose-free interview control path
        run: python scripts/ci/check-process-control.py
      - name: Link real ES modules without DOM or network
        run: node --experimental-vm-modules scripts/ci/check-operator-modules.mjs
      - run: DELIVERY_TEST_SCOPE=gate ./scripts/test-local.sh

  matrix:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.action == 'ready_for_review'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: python -m pip install vendor/vmodel_contracts-0.29.0-py3-none-any.whl vendor/requi_child_contract-0.3.0-py3-none-any.whl
      - name: Enforce zero UI component exceptions
        run: python scripts/ci/check-ui-boundaries.py
      - run: DELIVERY_TEST_SCOPE=pr ./scripts/test-local.sh
        env:
          DELIVERY_CORE_SHARD: ${{ matrix.shard }}
          DELIVERY_CORE_SHARDS: '4'
          DELIVERY_BROWSER_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'smoke' }}

  fresh-start-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real runtime and test packages
        run: |
          python -m pip install vendor/vmodel_contracts-0.29.0-py3-none-any.whl vendor/requi_child_contract-0.3.0-py3-none-any.whl
          python -m pip install -e '.[dev]'
          sha256sum --check vendor/acceptance-producers.sha256
          python -m pip install vendor/interview_engine-0.1.0-py3-none-any.whl vendor/spec_generator-0.1.0-py3-none-any.whl
      - name: Real startup and first interview stage, zero credits
        run: python scripts/ci/fresh-start-acceptance.py

  # Tracked cosmetic debt, not part of the merge-gating selection: visual-polish
  # assertions marked ui_cosmetic. This job reports honest red on failure so the
  # debt stays visible; the gating test job excludes these tests, and the image
  # build does not wait on this job.
  ui-cosmetic:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: python -m pip install vendor/vmodel_contracts-0.29.0-py3-none-any.whl vendor/requi_child_contract-0.3.0-py3-none-any.whl
      - run: DELIVERY_TEST_SCOPE=cosmetic ./scripts/test-local.sh

  control-plane-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build pgserver psycopg[binary]
      - run: python -m build --wheel --outdir /tmp/control-plane-wheels
      - name: Clean delivery-only install and dry startup
        run: |
          python -m venv /tmp/control-plane-runtime
          /tmp/control-plane-runtime/bin/pip install vendor/vmodel_contracts-0.29.0-py3-none-any.whl vendor/requi_child_contract-0.3.0-py3-none-any.whl /tmp/control-plane-wheels/*.whl 'psycopg[binary]>=3.2,<4'
          /tmp/control-plane-runtime/bin/pip check
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/docker/owned-pg-smoke.py" "$GITHUB_WORKSPACE" /tmp/control-plane-runtime/bin/python "$GITHUB_WORKSPACE/scripts/docker/control-plane-smoke.py"

  image:
    if: github.event_name == 'workflow_dispatch'
    needs: [matrix, control-plane-wheel, fresh-start-acceptance]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Dry delivery-only container gate before publication
        run: |
          docker build --tag requi-control-plane-check .
          docker build --file scripts/docker/Dockerfile.pg-smoke --tag requi-control-plane-pg-check .
          docker run --detach --name requi-control-plane-check --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 requi-control-plane-pg-check
          trap 'docker logs requi-control-plane-check; docker rm --force requi-control-plane-check' EXIT
          for attempt in $(seq 1 20); do
            state=$(docker inspect --format '{{.State.Health.Status}}' requi-control-plane-check)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then exit 1; fi
            sleep 3
          done
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
