name: CI and deploy

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: delivery-api-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/shyalon/delivery-api

jobs:
  test:
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 20 || 10 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - run: python -m pip install vendor/vmodel_contracts-0.28.0-py3-none-any.whl
      - run: DELIVERY_TEST_SCOPE=pr ./scripts/test-local.sh
        env:
          DELIVERY_BROWSER_SCOPE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'smoke' }}

  control-plane-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel --outdir /tmp/control-plane-wheels
      - name: Clean delivery-only install and dry startup
        run: |
          python -m venv /tmp/control-plane-runtime
          /tmp/control-plane-runtime/bin/pip install vendor/vmodel_contracts-0.28.0-py3-none-any.whl /tmp/control-plane-wheels/*.whl 'psycopg[binary]>=3.2,<4'
          /tmp/control-plane-runtime/bin/pip check
          cd /tmp
          /tmp/control-plane-runtime/bin/python "$GITHUB_WORKSPACE/scripts/docker/control-plane-smoke.py"

  image:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, control-plane-wheel]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Dry delivery-only container gate before publication
        run: |
          docker build --tag requi-control-plane-check .
          docker run --detach --name requi-control-plane-check --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 requi-control-plane-check
          trap 'docker logs requi-control-plane-check; docker rm --force requi-control-plane-check' EXIT
          for attempt in $(seq 1 20); do
            state=$(docker inspect --format '{{.State.Health.Status}}' requi-control-plane-check)
            if [ "$state" = healthy ]; then exit 0; fi
            if [ "$state" = unhealthy ]; then exit 1; fi
            sleep 3
          done
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'workflow_dispatch' && vars.CONTROL_PLANE_DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Require deployment secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          test -n "$HETZNER_HOST" || { echo 'Error: HETZNER_HOST is unset. Next: gh secret set HETZNER_HOST'; exit 1; }
          test -n "$HETZNER_SSH_KEY" || { echo 'Error: HETZNER_SSH_KEY is unset. Next: gh secret set HETZNER_SSH_KEY < ~/.ssh/vmodel-deploy'; exit 1; }
      - name: Trust host and load deploy key
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/vmodel-deploy
          chmod 600 ~/.ssh/vmodel-deploy
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
      - name: Deploy immutable image and verify health
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_IMAGE: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/vmodel-deploy deploy@"$HETZNER_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          scp -i ~/.ssh/vmodel-deploy scripts/deploy-server.sh deploy@"$HETZNER_HOST":/tmp/deploy-server.sh
          ssh -i ~/.ssh/vmodel-deploy deploy@"$HETZNER_HOST" \
            "chmod +x /tmp/deploy-server.sh && /tmp/deploy-server.sh '$DEPLOY_IMAGE' /etc/requi/control-plane.env"
