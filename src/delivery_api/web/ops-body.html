<style>
:root{--ok:#16a36a;--warn:#b45309;--info:#1d4ed8}
.hview{}
body:not([data-view=stops]) #stops-view,body:not([data-view=spend]) #spend-view,body:not([data-view=grant]) #grant-view,body[data-view=stops] .hview,body[data-view=spend] .hview,body[data-view=grant] .hview{display:none !important}
#spend-view,#grant-view,#stops-view{flex:1;min-height:0}
#grant-form{display:flex;gap:10px;flex-wrap:wrap;align-items:end;padding:10px 12px}
#grant-form label{display:flex;flex-direction:column;font:var(--fs-xs) DM Mono;letter-spacing:.06em;color:var(--muted);gap:4px}
#grant-preview{padding:0 12px 10px;white-space:pre-line}
#spend-cards{display:flex;gap:10px;flex-wrap:wrap;padding:10px 12px 0}
#flags{display:flex;flex-direction:column;gap:4px}
.flag{padding:6px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.flag.ok{border-color:var(--ok);color:var(--ok)}.flag.warning{border-color:var(--warn);color:var(--warn);background:#fff7ed}.flag.info{border-color:var(--info);color:var(--info)}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.card{padding:8px 12px}
.card .k{color:var(--muted);font:var(--fs-xs) DM Mono;letter-spacing:.06em}.card .v{font:700 var(--fs-lg) Manrope}.card .s{color:var(--muted);font-size:var(--fs-xs)}
#panels{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px}
#p-recent{grid-column:1/-1}
#p-sessions .scroll,#p-running .scroll{max-height:230px}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel h2{font:700 var(--fs-md) Manrope;margin:0;padding:10px 12px 0}
.tools{display:flex;gap:8px;align-items:center;padding:8px 12px}
.scroll{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;text-align:left;padding:8px 10px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line);user-select:none}
td{padding:6px 10px;border-bottom:1px solid #eceae2;white-space:nowrap}
td.num,th.num{text-align:right}
.pager{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-sm)}
.pager .grow{flex:1}
@media(max-width:900px){#panels{grid-template-columns:1fr;grid-template-rows:auto}}
</style>
<div id="frame">
<div class="ops-toolbar">
 <h1 id="page-title" title="Operator view of this server. Only administrators can load the numbers.">Operator</h1>
 <span class="asof" id="asof" title="When these numbers were read, in your time zone. They refresh by themselves every 10 seconds."></span>
 <span class="grow"></span>
 <label class="hview" for="mins" title="How far back the downloaded log goes. The server keeps at most the newest 2000 lines.">Log Window</label>
 <select id="mins" class="hview" title="How far back the downloaded log goes. The server keeps at most the newest 2000 lines.">
  <option value="15">Last 15 Minutes</option><option value="60" selected>Last Hour</option><option value="240">Last 4 Hours</option></select>
 <button id="dl" class="hview" title="Download the scrubbed server log as a zip file. Secrets, emails and tokens are removed, and the download is recorded.">Download Logs</button>
 <button id="refresh" class="secondary" title="Read the numbers again now. They also update by themselves every 10 seconds.">Refresh</button>
 <span class="refresh-note" title="The Server Health numbers update by themselves.">Updates Every 10 Seconds</span>
</div>
<div id="flags" class="hview"></div>
<div id="cards" class="hview"></div>
<div id="panels" class="hview">
 <section class="panel" id="p-sessions"></section><section class="panel" id="p-running"></section>
 <section class="panel" id="p-recent"></section>
</div>
<section class="panel" id="stops-view"></section>
<section class="panel" id="spend-view"></section>
<section class="panel" id="grant-view"></section>
<div id="note" class="hview"></div>
</div>
