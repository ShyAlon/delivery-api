<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Regenerated Requirements</title>
<style>
:root{color-scheme:light;--ink:#18271f;--paper:#faf9f4;--ground:#f1efe8;--green:#28483a}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{border-bottom:1px solid #d5d8ce;background:var(--paper);padding:16px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}main{max-width:1100px;margin:32px auto;padding:0 20px}h1{font-size:34px;line-height:1.15;margin:14px 0}h2{font-size:22px;margin-top:0}.muted{color:#526158}.notice{background:#e8ebdf;border-left:4px solid #7d943e;padding:16px;margin:20px 0}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.panel{background:var(--paper);border:1px solid #d5d8ce;padding:24px}label{display:block;margin:16px 0}input[type=radio],input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:10px}textarea{width:100%;font:inherit;min-height:130px;padding:12px;border:1px solid #839487;background:white}button{min-height:48px;padding:12px 20px;font:inherit;cursor:pointer;border:1px solid var(--green);background:var(--green);color:white}button:disabled{opacity:.6;cursor:wait}button.link{background:none;border:0;color:var(--green);text-align:left;padding:8px 0;text-decoration:underline;min-height:44px}details{border-top:1px solid #d5d8ce;margin-top:20px;padding-top:12px}summary{cursor:pointer;min-height:44px}.choice{border:1px solid #ccd5c6;padding:12px;margin:12px 0}.choice small{display:block;margin-left:34px}#errors{color:#8b2525}#status{min-height:48px;margin:16px 0}[hidden]{display:none!important}.submitted{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){main{margin:20px auto}.layout{grid-template-columns:1fr}h1{font-size:28px}.panel{padding:20px}}
</style>
<header><strong>Requi.re</strong><span>Test Preview Only · No Work Will Run</span><span id="cost">Spent So Far: 4.20 Credits</span></header>
<main id="page"></main>
<script>
const page=document.querySelector('#page'),state={phase:0,choice:'approve',change:'',ack:false,submitted:null,busy:false,failNext:false};
const phases=[{name:'Requirements',next:'Architecture',summary:'The System Shall Show Current Task Status To Each Family Member.',change:'Offline Status',detail:'The regenerated requirements explain how the last known task status stays visible offline and how updates are reconciled after reconnecting.'},{name:'Architecture',next:'Item Specifications',summary:'Keep A Local Read-Only Status Cache And Reconcile Updates After Reconnecting.',change:'Offline Status Cache',detail:'The proposed architecture keeps the approved interview and needs unchanged. It adds a local status cache and a reconciliation boundary.'}];
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const p=phases[state.phase];if(!p){page.innerHTML='<section class="panel"><h1>Reviews Complete</h1><p>Your Test Decisions Have Been Saved. No Session Was Installed And No Paid Work Was Started.</p><p class="submitted">'+esc(state.submitted?.change||'Approved As Shown')+'</p></section>';return}
page.innerHTML=`<a href="#" id="back">Back To Test Task</a><p class="muted">Regenerated ${esc(p.name)} · Review ${state.phase+1} Of 2</p><h1>Review Regenerated ${esc(p.name)}</h1><p>Decide whether this result reflects your requested change before continuing.</p><div class="layout"><section class="panel"><h2>What You Are Deciding</h2><p>${esc(p.detail)}</p><h2>Regenerated Result</h2><p>${esc(p.summary)}</p>${state.submitted?'<div class="notice"><strong>Your Submitted Decision</strong><p class="submitted-current submitted">'+esc(state.submitted.change||'Approved As Shown')+'</p></div>':''}<details><summary>What Changed</summary><p>${esc(p.change)} was regenerated. Approved upstream documents stay unchanged. This phase and affected downstream results need new approval.</p></details><details><summary>Previous Result</summary><p>The previous generation is kept for comparison and traceability. This review does not overwrite it.</p></details><details><summary>Your Last Submitted Decision</summary><p class="submitted">${esc(state.submitted?.change||state.submitted?.choice||'No Decision Submitted Yet')}</p></details></section><form class="panel" id="decision"><h2>Your Decision</h2><label class="choice"><input type="radio" name="choice" value="approve" ${state.choice==='approve'?'checked':''}>Approve<small>Accepts this regenerated result as shown and moves to ${esc(p.next)}. The next phase waits for its own approval.</small></label><label class="choice"><input type="radio" name="choice" value="edit" ${state.choice==='edit'?'checked':''}>Ask For Changes<small>Regenerates this phase using your note. Nothing moves on until you review the new result.</small></label><div id="edit-fields" ${state.choice==='edit'?'':'hidden'}><label for="change">What Should Change?</label><textarea id="change" maxlength="20000">${esc(state.change)}</textarea><button type="button" id="save" class="link">Save Draft Only</button><p id="draft-status" role="status"></p></div><div class="notice"><strong>Extra Cost Before Continuing</strong><p>Regenerating this phase or continuing affected downstream work incurs extra cost. The total is not known yet. Each call still needs credit admission.</p><p>This is a fake review. No credits will be charged.</p></div><label id="ack-label"><input id="ack" type="checkbox" ${state.ack?'checked':''}>I Understand That Continuing Or Regenerating Incurs Extra Cost</label><div id="errors" role="alert"></div><button id="continue" type="submit">Continue With ${state.choice==='approve'?'Approval':'Changes'}</button><p id="status" role="status" aria-live="polite"></p></form></div>`;
page.querySelector('#back').onclick=e=>{e.preventDefault();document.querySelector('h1').scrollIntoView()};
page.querySelectorAll('[name=choice]').forEach(input=>input.onchange=()=>{state.choice=input.value;page.querySelector('#edit-fields').hidden=state.choice!=='edit';page.querySelector('#continue').textContent='Continue With '+(state.choice==='approve'?'Approval':'Changes');page.querySelector('#errors').innerHTML=''});
page.querySelector('#change').oninput=e=>state.change=e.target.value;
page.querySelector('#ack').onchange=e=>state.ack=e.target.checked;
page.querySelector('#save').onclick=async()=>{const button=page.querySelector('#save'),status=page.querySelector('#draft-status');button.disabled=true;status.textContent='Saving Draft…';await new Promise(r=>setTimeout(r,100));state.change=page.querySelector('#change').value;localStorage.setItem('requi-private-revision-draft',state.change);status.textContent='Draft Saved. The Approved Result And Downstream Work Are Unchanged.';button.disabled=false};
page.querySelector('#decision').onsubmit=submit;
}
async function submit(event){event.preventDefault();if(state.busy)return;const missing=[];if(state.choice==='edit'&&!state.change.trim())missing.push(['Describe What Should Change','#change']);if(!state.ack)missing.push(['Acknowledge The Extra Cost','#ack']);const errors=page.querySelector('#errors');errors.innerHTML=missing.length?'<p>Complete These Inputs Before Continuing:</p>'+missing.map(([text,target])=>`<button type="button" class="link" data-target="${target}">${text}</button>`).join(''):'';errors.querySelectorAll('button').forEach(button=>button.onclick=()=>{const input=page.querySelector(button.dataset.target);input.scrollIntoView({behavior:'smooth',block:'center'});input.focus()});if(missing.length){errors.querySelector('button').click();return}state.busy=true;const button=page.querySelector('#continue'),status=page.querySelector('#status');button.disabled=true;status.textContent='Saving Your Test Decision…';try{await new Promise(r=>setTimeout(r,250));if(state.failNext){state.failNext=false;throw new Error('The Test Decision Could Not Be Saved. Your Inputs Are Kept. Retry Once.')}state.submitted={choice:state.choice,change:state.change};localStorage.setItem('requi-private-revision-submitted',JSON.stringify(state.submitted));status.textContent=state.choice==='edit'?'Changes Saved. Review The Regenerated Result Next…':'Decision Saved. Moving To The Next Review…';await new Promise(r=>setTimeout(r,400));if(state.choice==='approve')state.phase++;state.choice='approve';state.ack=false;state.busy=false;render();window.scrollTo(0,0)}catch(error){status.textContent=error.message;button.disabled=false;state.busy=false}}
state.change=localStorage.getItem('requi-private-revision-draft')||'';try{state.submitted=JSON.parse(localStorage.getItem('requi-private-revision-submitted')||'null')}catch{}window.revisionPreview={failNext:()=>state.failNext=true};render();
</script></html>
